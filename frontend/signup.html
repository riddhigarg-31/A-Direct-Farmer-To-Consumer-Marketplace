
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | FarmFresh</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Website Logo -->
            <div class="logo">
                <h1>🌱 FarmFresh</h1>
                <p>Fresh From Farm to Your Home</p>
            </div>

            <!-- Signup Heading -->
            <div class="auth-heading">
                <h2>Create Your Account</h2>
                <p>Join us and get fresh vegetables directly from farmers.</p>
            </div>

            <!-- Signup Form -->
            <form id="signupForm">

                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Enter last name"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <!-- Password Visibility -->
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="showPassword">
                        Show Password
                    </label>
                </div>

                <!-- Terms and Conditions -->
                <div class="form-options terms">
                    <label>
                        <input type="checkbox" id="terms" required>
                        I agree to the Terms and Conditions
                    </label>
                </div>

                <!-- Signup Button -->
                <button type="submit" class="auth-btn">
                    Create Account
                </button>

                <!-- Message Area -->
                <div id="signupMessage" class="auth-message"></div>

            </form>

            <!-- Login Link -->
            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">Login Here</a>
                </p>

                <p>
                    By joining FarmFresh, you support local farmers.
                </p>

                <a href="index.html" class="home-link">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="auth.js"></script>

</body>
</html>
