<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FarmFresh Marketplace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Dedicated Contact CSS -->
    <link rel="stylesheet" href="contact.css">
</head>
<body class="bg-light">

    <!-- Simple Navbar -->
    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌱 FarmFresh Marketplace</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Back to Home</a>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-5 rounded shadow-sm border">
                <h2 class="mb-3 text-success fw-bold text-center">Contact Us</h2>
                <p class="text-muted text-center mb-4">Have questions about farm-fresh produce or deliveries? Drop us a message!</p>
                
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Your Name</label>
                        <input type="text" id="userName" class="form-control" required placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" id="userEmail" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea id="userMessage" class="form-control" rows="4" required placeholder="Type your message here..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Dedicated Contact JS -->
    <script src="contact.js"></script>
</body>
</html>
